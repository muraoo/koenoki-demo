<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>声の木 体験版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef2f0; --surface:#ffffff; --fg:#1d2a33; --muted:#5d6b73; --line:#d3dcd8;
  --accent:#27507f; --accent-fg:#ffffff; --soft:#e3ebf3; --warn:#b4432f; --ok:#2f7d4f;
  --trunk:#7a5a40; --creator:#e8659a;
  --stage:#0f1c33; --stage-fg:#e8eef7; --stage-muted:#9fb0c8; --stage-line:#24365a;
  --display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111821; --surface:#18222d; --fg:#e4ebf0; --muted:#9aa9b3; --line:#2a3846;
  --accent:#7fa8db; --accent-fg:#0d1622; --soft:#1f2e40; --warn:#e57a63; --ok:#6cc08f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111821; --surface:#18222d; --fg:#e4ebf0; --muted:#9aa9b3; --line:#2a3846;
  --accent:#7fa8db; --accent-fg:#0d1622; --soft:#1f2e40; --warn:#e57a63; --ok:#6cc08f; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;justify-content:space-between}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;letter-spacing:.04em}
.sub{color:var(--muted);font-size:.82rem;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.leaf:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:999px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.banner{font-size:.85rem;border-radius:10px;padding:10px 14px;margin:0;background:var(--soft)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--fg)}
.booth{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:900px){.booth{grid-template-columns:minmax(0,1fr)}.booth .stagebox{order:2}}
.stage{background:var(--stage);color:var(--stage-fg);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.stage-title{font-family:var(--display);font-size:1.2rem;letter-spacing:.06em}
.stage-q{font-size:.9rem;color:var(--stage-fg);margin:0}
.stage-count{color:var(--stage-muted);font-size:.85rem;font-variant-numeric:tabular-nums}
svg.tree{width:100%;height:auto;display:block}
.leaf{cursor:pointer}
.leaf path{stroke:rgba(0,0,0,.25);stroke-width:.06}
.leaf.sel path{stroke:#fff;stroke-width:.16}
.anim{transform-box:fill-box;transform-origin:center}
@keyframes sprout{from{transform:scale(0)}to{transform:scale(1)}}
.sprout{animation:sprout .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.pulse{animation:pulse .6s ease-out}
@keyframes bloom{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.bloom{animation:bloom 4.2s ease-in-out both}
@keyframes fade{0%{opacity:0}15%{opacity:1}82%{opacity:1}100%{opacity:0}}
.fade{animation:fade 4.2s ease-in-out both}
@keyframes attractIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.attract-in{animation:attractIn .6s ease-out both}
.blabel{transition:font-size .6s ease}
@media (prefers-reduced-motion:reduce){.sprout,.pulse,.bloom,.fade,.attract-in{animation:none}.blabel{transition:none}}
.caption{min-height:3.2em;border-top:1px solid var(--stage-line);padding-top:10px;font-size:.95rem}
.caption small{display:block;color:var(--stage-muted);font-size:.78rem}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.8rem;color:var(--stage-muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px 16px 20px;min-height:520px;display:flex;flex-direction:column;gap:12px;min-width:0}
.phone-top{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
#flow{display:flex;flex-direction:column;gap:12px}
.phone h2{font-size:1.1rem;margin:0;text-wrap:balance}
.phone p{margin:0}
.muted{color:var(--muted);font-size:.85rem}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:8px 14px;font-weight:700}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px 0;font-size:.88rem;align-self:flex-start}
.voice{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.voice .txt{flex:1;min-width:0;font-size:.92rem;overflow-wrap:anywhere}
.voice .tag{display:block;font-size:.72rem;color:var(--muted)}
.voice .txt b{display:block}
.agree{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap;font-size:.85rem}
.agree[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 12px;text-align:left;font-size:.92rem}
.row .chip{padding:6px 10px;border-radius:999px;font-size:.85rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);font-weight:700}
.q-label{font-size:.85rem;font-weight:700}
.q-label span{font-weight:400;color:var(--muted);font-size:.78rem}
textarea,input[type=text],input[type=search],select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--fg);max-width:100%}
textarea{width:100%;resize:vertical;min-height:84px}
.count{text-align:right;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.err{color:var(--warn);font-size:.85rem}
.okmsg{color:var(--ok);font-size:.85rem}
.card{border-radius:14px;background:var(--soft);padding:14px;display:flex;gap:12px;align-items:center}
.num{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border-radius:10px;padding:8px 12px;flex:none}
.num small{font-size:.7rem;color:var(--muted)}
.num b{font-size:1.2rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
/* 待機画面 */
.idlewrap{display:flex;flex-direction:column;gap:12px}
/* 声の木サイト */
.site{display:flex;justify-content:center}
.sitebox{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.sitebox h2{font-size:1.1rem;margin:0}
.big{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.mini ul{margin:6px 0 0;padding-left:1.1em}
.lookup{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lookup input{flex:1;min-width:8em}
/* 管理 */
.admin{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-size:1.05rem;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:.78rem;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hid td{opacity:.5}
.brow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brow input{flex:1;min-width:10em}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem}
/* ===== ビジュアル強化 ===== */
.stage{background:linear-gradient(160deg,#120a2e,#1d1246 60%,#2a1640);border:1px solid rgba(255,217,160,.25);box-shadow:0 18px 50px -18px rgba(40,10,80,.6),inset 0 0 0 1px rgba(255,255,255,.04)}
.stage-title{background:linear-gradient(90deg,#fff,#ffd9a0 60%,#ff9ecb);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,190,140,.35))}
.stage-q{color:#f4e9ff}
.stage-count{color:#cdbbe8}
.scene{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:600/500;box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
.scene svg,.scene canvas{position:absolute;inset:0;width:100%;height:100%}
.scene canvas,.scene svg.cut{pointer-events:none}
#view-idle .stage{width:100%;max-width:calc((100vh - 150px)*1.2);margin:0 auto}
.legend{color:#cdbbe8}
.caption{border-top-color:rgba(255,217,160,.2)}
.caption small{color:#cdbbe8}
.star{animation:twk 4s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.25}50%{opacity:1}}
.twinkle{animation:twk2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twk2{0%,100%{opacity:.3;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.rays{animation:rays 9s ease-in-out infinite}
@keyframes rays{0%,100%{opacity:.5}50%{opacity:1}}
.sway{animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
.flutter{animation:flut 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flut{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.04)}}
.leaf:hover .flutter{filter:brightness(1.3)}
.sprout{animation:sprout2 1.1s cubic-bezier(.2,1.8,.4,1) both}
@keyframes sprout2{0%{transform:scale(0) rotate(-90deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
.pulse{animation:pulse2 .7s ease-out}
@keyframes pulse2{0%{transform:scale(1)}35%{transform:scale(1.55)}100%{transform:scale(1)}}
.cutin{animation:life 4.6s linear both}
@keyframes life{0%,96%{opacity:1}100%{opacity:0}}
.cutin .fade{animation:fade2 4.6s ease-in-out both}
@keyframes fade2{0%{opacity:0}8%{opacity:.78}85%{opacity:.78}100%{opacity:0}}
.flash{animation:flash .45s ease-out both}
@keyframes flash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}
.speed{animation:speed 4.6s ease-out both;transform-origin:300px 240px}
@keyframes speed{0%{opacity:0;transform:scale(1.4)}8%{opacity:1;transform:scale(1)}30%{opacity:.7}70%{opacity:.35}100%{opacity:0;transform:scale(.96) rotate(3deg)}}
.ring{animation:ring 1.3s cubic-bezier(.1,.6,.3,1) both;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.2);opacity:1;stroke-width:8}100%{transform:scale(4.5);opacity:0;stroke-width:.5}}
.band{animation:band 4.6s cubic-bezier(.2,.9,.3,1) both}
@keyframes band{0%{transform:translateX(-640px)}10%{transform:translateX(0)}86%{transform:translateX(0);opacity:1}100%{transform:translateX(640px);opacity:0}}
.pop{animation:pop 4.6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(2.2)}9%{opacity:1;transform:scale(.94)}13%{transform:scale(1.04) translate(2px,-1px)}15%{transform:scale(1) translate(-2px,1px)}17%{transform:scale(1)}86%{opacity:1;transform:scale(1.03)}100%{opacity:0;transform:scale(.7) translateY(-80px)}}
@media (prefers-reduced-motion:reduce){.star,.twinkle,.rays,.sway,.flutter,.sprout,.pulse,.speed,.ring,.band,.pop,.flash{animation:none}.cutin{animation:life 3s linear both}}
.kasumi{animation:kasumi 26s ease-in-out infinite}.kasumi.k2{animation-duration:34s;animation-direction:reverse}
@keyframes kasumi{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.win{animation:twk 5s ease-in-out infinite}
.stamp{animation:stamp 4.6s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes stamp{0%,18%{opacity:0;transform:scale(3)}24%{opacity:1;transform:scale(.9)}28%{transform:scale(1)}86%{opacity:1}100%{opacity:0}}
.spin{animation:spin 4.6s linear both;transform-origin:300px 230px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(40deg)}}
.floatup{animation:floatup 1.25s ease-out both}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.hud{display:flex;align-items:center;gap:8px;font-size:.8rem;color:#f4e9ff;flex-wrap:wrap}
.hud .lv{font-family:var(--display);font-size:.95rem;background:linear-gradient(180deg,#fffbe0,#ffd25a 55%,#ff8a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(255,180,80,.5))}
.hud .lv b{font-weight:400;font-size:1.25rem}
.hud .lvname{border:1px solid rgba(255,217,160,.5);border-radius:4px;padding:0 6px;font-weight:700;color:#ffd9a0;background:rgba(255,217,160,.08)}
.hud .xp{width:120px;height:9px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,217,160,.35)}
.hud .xp i{display:block;height:100%;background:linear-gradient(90deg,#7a6cff,#ff9ecb,#ffd25a);box-shadow:0 0 10px #ffd25a;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.hud .xpt{font-variant-numeric:tabular-nums;color:#cdbbe8;font-size:.75rem}
.stage-count{margin-top:-4px}
.combo{font-family:var(--display);color:#d9649a;font-size:.8rem;letter-spacing:.04em}
.combo.bump{animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{0%{transform:scale(1.6)}100%{transform:scale(1)}}
#stepLabel{font-family:var(--display);letter-spacing:.06em;color:#7a6cff}
.exp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed #d9a54a;border-radius:10px;padding:8px 12px;font-size:.85rem;background:color-mix(in srgb,#ffd25a 10%,var(--surface))}
.exp b{font-family:var(--display);font-weight:400;color:#c76a12;font-size:1rem}
@media (prefers-reduced-motion:reduce){.kasumi,.win,.stamp,.spin,.floatup,.combo.bump{animation:none}}
/* 来場者の画面 */
.phone{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 88%,#ffd9a0));box-shadow:0 18px 40px -22px rgba(40,10,80,.45);position:relative;overflow:hidden}
.phone::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,rgba(255,158,203,.22),transparent 260px);pointer-events:none}
.steps span.on{background:linear-gradient(90deg,#7a6cff,#ff9ecb)}
.primary{background:linear-gradient(120deg,#4a3fb8,#7a4fc8 55%,#d9649a);color:#fff;box-shadow:0 8px 20px -8px rgba(122,79,200,.7);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.primary:active{transform:scale(.97)}
.agree{border-color:#d9649a;color:#c24f86;position:relative;transition:transform .15s}
.agree[aria-pressed="true"]{background:linear-gradient(120deg,#ff7eb6,#d9649a);color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(255,126,182,.6)}
.agree.pop-b{animation:popb .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes popb{0%{transform:scale(.8)}100%{transform:scale(1)}}
.spark-dom{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;background:#ff9ecb;box-shadow:0 0 8px #ff9ecb;animation:sd .6s ease-out forwards}
@keyframes sd{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#flow>*{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
#flow>*:nth-child(2){animation-delay:.05s}#flow>*:nth-child(3){animation-delay:.1s}#flow>*:nth-child(4){animation-delay:.15s}#flow>*:nth-child(5){animation-delay:.2s}#flow>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.voice{background:var(--surface);transition:border-color .2s,box-shadow .2s}
.voice:hover{border-color:#c9b8f0;box-shadow:0 4px 14px -8px rgba(122,79,200,.5)}
.card{background:linear-gradient(120deg,color-mix(in srgb,#7a6cff 18%,var(--surface)),color-mix(in srgb,#ff9ecb 18%,var(--surface)))}
.num b{background:linear-gradient(90deg,#4a3fb8,#d9649a);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-reduced-motion:reduce){#flow>*,.primary::after,.agree.pop-b,.spark-dom{animation:none}}

/* ===== 体験版レイアウト ===== */
body{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ghostbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:.85rem}
body[data-mode="answer"] .topbtns,body[data-mode="site"] .topbtns,body[data-mode="admin"] .topbtns{display:none}
body[data-mode="screen"]{background:#0b0720;color:#f4e9ff}
body[data-mode="screen"] .wrap{max-width:none;padding-block:12px 16px}
body[data-mode="screen"] h1{color:#fff}
body[data-mode="screen"] .sub{color:#cdbbe8}
body[data-mode="screen"] .ghostbtn{background:transparent;color:#cdbbe8;border-color:#3a2f66}
.screen{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1000px){.screen{grid-template-columns:minmax(0,1fr)}}
.screenStage .stage{max-width:calc((100vh - 120px)*1.2);margin:0 auto}
.side{display:flex;flex-direction:column;gap:14px}
.side .phone{min-height:0}
.qrcard{background:linear-gradient(160deg,#1d1246,#2a1640);border:1px solid rgba(255,217,160,.35);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 0 30px -10px rgba(255,180,120,.4)}
.qrhead{font-family:var(--display);font-size:1.3rem;letter-spacing:.08em;background:linear-gradient(90deg,#fff,#ffd9a0 60%,#ff9ecb);-webkit-background-clip:text;background-clip:text;color:transparent}
.qrbox{background:#fff;border-radius:12px;padding:8px;width:220px;max-width:70vw;aspect-ratio:1;box-shadow:0 0 0 4px rgba(255,217,160,.5),0 0 30px rgba(255,217,160,.35)}
.qrbox svg{width:100%;height:100%;display:block}
.qrnote{margin:0;font-size:.88rem;color:#f4e9ff}
.qrurl{margin:0;font-size:.72rem;color:#9f8fc8;word-break:break-all}
.or{width:100%;display:flex;align-items:center;gap:8px;color:#9f8fc8;font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:#3a2f66}
.answer{display:flex;justify-content:center}
.answer .phone{width:100%;max-width:480px;border-radius:22px;min-height:0}
body[data-mode="answer"] .wrap{padding-block:12px 24px}
body[data-mode="answer"] h1{font-size:1.25rem}
.phone .chip{min-height:44px}
.agree{min-height:40px}

  const v=voices.find(x=>x.n===siteNo);
  if(!v){b.append(mk('p',{class:'err'},'その番号の声は見つかりませんでした。'));return}
  if(v.hidden){b.append(mk('p',{class:'muted'},'この声は、いまは表示を止めています。'));return}
  const A=agg||aggregate();const s=A.vOf(v.id);
  const g=groups().find(x=>x.id===branchIdOf(v));
  const m1=mk('div',{class:'mini'});m1.append(mk('span',{class:'muted'},`${v.no}・${ROLE_N[v.role]||''}の声`),mk('div',{},`「${v.text}」`));b.append(m1);
  const big=mk('div');big.append(mk('div',{class:'big'},`わかる ${s.total}`),mk('div',{class:'muted'},`クリエイター ${s.creator}人・一般市民 ${s.citizen}人・どちらも ${s.both}人（${s.imp}人の画面に表示）`));b.append(big);
  if(g){
    const sib=g.vs.filter(x=>x.id!==v.id).sort((a,c)=>A.vOf(c.id).total-A.vOf(a.id).total);
    const m2=mk('div',{class:'mini'});m2.append(mk('b',{},`同じ枝「${g.name}」の声`),mk('div',{class:'muted'},`あなたを含めて${g.vs.length}件の声があります。`));
    const ul=mk('ul');sib.slice(0,5).forEach(x=>ul.append(mk('li',{},`${x.text}（わかる ${A.vOf(x.id).total}）`)));if(sib.length)m2.append(ul);b.append(m2);
  }
  const back=mk('button',{class:'link'},'ほかの番号を見る');back.onclick=()=>{siteNo=null;renderSite()};b.append(back);
}

/* ============ 主催者画面（合言葉つき） ============ */
let adminPass=null; try{adminPass=sessionStorage.getItem('kn_pass')}catch(e){}
async function adm(op,args={}){return rpc('kn_admin',{p_pass:adminPass,p_op:op,p_args:args})}
function renderAdmin(){
  const box=$('adminBody');if(!box)return;
  if(!adminPass){
    if(box.dataset.mode==='login')return;box.dataset.mode='login';box.innerHTML='';
    const p=mk('div',{class:'panel'});p.append(mk('h2',{},'主催者の合言葉'));
    const inp=mk('input',{type:'text',placeholder:'合言葉','aria-label':'合言葉',autocomplete:'off'});const go=mk('button',{class:'secondary'},'入る');const msg=mk('p',{class:'err'});
    go.onclick=async()=>{adminPass=inp.value.trim();try{await adm('check');try{sessionStorage.setItem('kn_pass',adminPass)}catch(e){}box.dataset.mode='';renderAdmin()}catch(e){adminPass=null;msg.textContent='合言葉がちがいます'}};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
    const r=mk('div',{class:'brow'});r.append(inp,go);p.append(r,msg);box.append(p);return;
  }
  if(box.contains(document.activeElement)&&document.activeElement.tagName!=='BUTTON')return;
  box.dataset.mode='admin';box.innerHTML='';
  const A=aggregate();
  /* 状況 */
  const ss=sessions;const posted=ss.filter(s=>s.posted).length;
  const agrees=ss.reduce((s,x)=>s+(x.vA||[]).length+(x.bA||[]).length,0)+voices.reduce((s,v)=>s+(v.taps||0),0);
  const p1=mk('div',{class:'panel'});p1.append(mk('h2',{},'いまの状況'));
  const k=mk('div',{class:'kpis'});
  [[ss.length,'参加した人'],[ss.filter(s=>s.via==='qr').length,'うちQRから'],[ss.filter(s=>s.via==='touch').length,'うちタッチ画面から'],[posted,'声を足した人'],[voices.length,'声（非表示含む）'],[agrees,'押された「わかる」'],
   ...['creator','citizen','both'].map(r=>[ss.filter(s=>s.role===r).length,'立場：'+ROLE_N[r]])]
   .forEach(([v,l])=>{const d=mk('div',{class:'kpi'});d.append(mk('b',{},String(v)),mk('span',{},l));k.append(d)});
  p1.append(k);
  const sv_=voices.filter(v=>v.sample).length,ss_=ss.filter(s=>s.sample).length;
  p1.append(mk('p',{class:'muted',style:'margin:.6em 0 .2em'},`うちサンプル（デモ用のダミー）：声${sv_}件・参加${ss_}人。本物の回答：声${voices.length-sv_}件・参加${ss.length-ss_}人。`));
  const dangerBtn=(label,op,confirmText)=>{const b=mk('button',{class:'link'},label);b.onclick=async()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent=confirmText;return}
    try{await adm(op);knownVoiceIds=null;pull()}catch(e){b.textContent='できませんでした（サーバーの設定がまだかもしれません）'}};return b};
  const br=mk('div',{class:'brow',style:'flex-wrap:wrap;gap:.4em 1.2em'});
  br.append(dangerBtn('サンプルを入れ直す','seed_samples','本当に入れ直す'),dangerBtn('サンプルだけ消す','clear_samples','本当に消す（本物の回答は残ります）'),
    dangerBtn('本物の回答だけ消す','clear_real','本当に消す（元に戻せません）'),dangerBtn('すべて消す','reset_all','本当にすべて消す（元に戻せません）'));
  p1.append(br);box.append(p1);
  /* 問い */
  const p2=mk('div',{class:'panel'});p2.append(mk('h2',{},'問いとNGワード'));
  const q=mk('textarea',{maxlength:120,'aria-label':'問い'});q.value=cfg.question;
  const ng=mk('textarea',{'aria-label':'NGワード',placeholder:'追加のNGワード（1行に1つ）'});ng.value=(cfg.ng||[]).join('\n');
  const sv=mk('button',{class:'secondary'},'保存する');const sm=mk('span',{class:'muted'});
  sv.onclick=async()=>{try{await adm('set_config',{question:q.value,ng:ng.value.split(/\n|,|、/).map(s=>s.trim()).filter(Boolean)});sm.textContent='保存しました';pull()}catch(e){sm.textContent='保存できませんでした'}};
  const r2=mk('div',{class:'brow'});r2.append(sv,sm);
  p2.append(mk('div',{class:'q-label'},'その回の問い'),q,mk('div',{class:'q-label'},'NGワード（標準の言葉に加えて）'),ng,r2);box.append(p2);
  /* 枝 */
  const p3=mk('div',{class:'panel'});p3.append(mk('h2',{},'枝（似た声のまとまり）'),mk('p',{class:'muted',style:'margin:0'},'名前を変えたり、声を振り分けたりすると、スクリーンの木にすぐ反映されます。'));
  branches.forEach((b,i)=>{const r=mk('div',{class:'brow'});r.append(mk('i',{class:'dot',style:`background:${COLORS[i%COLORS.length]}`}));
    const inp=mk('input',{type:'text',maxlength:24,'aria-label':'枝の名前'});inp.value=b.name;inp.addEventListener('change',()=>adm('rename_branch',{id:b.id,name:inp.value}).then(pull));
    const del=mk('button',{class:'link'},'消す');del.onclick=()=>{if(!del.dataset.c){del.dataset.c=1;del.textContent='本当に消す';return}adm('delete_branch',{id:b.id}).then(pull)};
    r.append(inp,mk('span',{class:'muted'},`声${voices.filter(v=>v.branch===b.id&&!v.hidden).length}`),del);p3.append(r)});
  const nb=mk('input',{type:'text',maxlength:24,placeholder:'新しい枝の名前'});const ab=mk('button',{class:'secondary'},'枝を足す');
  ab.onclick=()=>{if(nb.value.trim())adm('add_branch',{name:nb.value}).then(pull)};
  const r3=mk('div',{class:'brow'});r3.append(nb,ab);p3.append(r3);box.append(p3);
  /* 声 */
  const p4=mk('div',{class:'panel'});p4.append(mk('h2',{},'声の一覧'));
  const tw=mk('div',{class:'tablewrap'});const tb=mk('table');
  tb.innerHTML='<thead><tr><th>番号</th><th>声</th><th>立場</th><th>経路</th><th>枝</th><th>わかる</th><th>表示</th><th></th></tr></thead>';
  const body=mk('tbody');
  [...voices].sort((a,b)=>b.n-a.n).forEach(v=>{const s=A.vOf(v.id);const tr=mk('tr',{class:v.hidden?'hid':''});
    tr.append(mk('td',{class:'n'},v.no),mk('td',{},v.sample?'［サンプル］'+v.text:v.text),mk('td',{},ROLE_N[v.role]||''),mk('td',{},v.via==='touch'?'タッチ':'QR'));
    const td=mk('td');const sl=mk('select',{'aria-label':'枝'});[['','（枝なし）'],...branches.map(b=>[b.id,b.name])].forEach(([id,n])=>sl.append(mk('option',{value:id},n)));
    sl.value=v.branch&&branches.some(b=>b.id===v.branch)?v.branch:'';sl.onchange=()=>adm('set_voice',{n:v.n,branch:sl.value,hidden:v.hidden}).then(pull);td.append(sl);tr.append(td);
    tr.append(mk('td',{class:'n'},String(s.total)),mk('td',{class:'n'},String(s.imp)));
    const th=mk('td');const hb=mk('button',{class:'link'},v.hidden?'表示に戻す':'非表示');hb.onclick=()=>adm('set_voice',{n:v.n,branch:v.branch||'',hidden:!v.hidden}).then(pull);th.append(hb);tr.append(th);
    body.append(tr)});
  if(!voices.length){const tr=mk('tr');tr.append(mk('td',{colspan:8,class:'muted'},'まだ声はありません'));body.append(tr)}
  tb.append(body);tw.append(tb);p4.append(tw);box.append(p4);
  const out=mk('button',{class:'link'},'合言葉を忘れてログアウト');out.onclick=()=>{adminPass=null;try{sessionStorage.removeItem('kn_pass')}catch(e){};box.dataset.mode='';renderAdmin()};box.append(out);
}

/* ============ 画面の組み立て ============ */
function answerUrl(){return location.origin+location.pathname+'?m=answer'}
function drawQr(){
  const q=$('qr');if(!q)return;
  if(typeof qrcode!=='function'){q.innerHTML='<img src="qr_answer.png" alt="回答ページのQR" style="width:100%;height:100%;image-rendering:pixelated">';$('qrUrl').textContent=answerUrl().replace(/^https?:\/\//,'');return}
  const qq=qrcode(0,'M');qq.addData(answerUrl());qq.make();q.innerHTML=qq.createSvgTag({cellSize:5,margin:2,scalable:true});
  $('qrUrl').textContent=answerUrl().replace(/^https?:\/\//,'');
}
let redrawT=null;
function refresh(){clearTimeout(redrawT);redrawT=setTimeout(()=>{aggregate();if(MODE==='screen')drawTree();if(MODE==='site')renderSite();if(MODE==='admin')renderAdmin();if(step===0)render();updSide()},120)}
function updSide(){const qc=$('qrCard');if(qc)qc.hidden=step>0}
function setup(){
  document.body.dataset.mode=MODE;
  {const q=new URLSearchParams(location.search).get('tate');const mq=matchMedia('(orientation:portrait)');
   const ap=()=>{const forced=q==='1';document.body.classList.toggle('tate',forced||(q!=='0'&&mq.matches));document.body.classList.toggle('forced',forced&&!mq.matches);
     if(MODE==='screen'){const t=document.body.classList.contains('tate'),H=innerHeight,W=document.body.classList.contains('forced')?H*9/16:innerWidth;
       document.documentElement.style.fontSize=Math.max(13,t?Math.min(W/68,H/120):Math.min(W/120,H/68)).toFixed(1)+'px'}
     try{fitFx()}catch(e){}};
   ap();mq.addEventListener('change',ap);addEventListener('resize',ap);}
  ['screen','answer','site','admin'].forEach(m=>{const e=$('view-'+m);if(e)e.hidden=m!==MODE});
  if(MODE==='site')$('subline').textContent='あなたの声は、どう育った？';if(MODE==='admin')$('subline').textContent='主催者画面';
  view=MODE==='screen'?'booth':MODE;
  if(MODE==='screen'){$('screenStage').appendChild(stage);$('side').appendChild($('phone'));$('view-answer').hidden=true;drawQr();
    $('fs').onclick=()=>{try{const r=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}};}
  if(MODE==='site'){const n=parseInt(new URLSearchParams(location.search).get('n')||'',10);if(!isNaN(n))siteNo=n}
  if(!API||!KEY){setStatus('サーバーの設定がまだです（KN_CONFIG）。',true);return}
  render();pull();flushOutbox();
  setInterval(pull,MODE==='screen'?2500:MODE==='admin'?4000:6000);
  setInterval(flushOutbox,10000);
  window.addEventListener('online',()=>{pull();flushOutbox();pump()});
}
setup();

</script>
